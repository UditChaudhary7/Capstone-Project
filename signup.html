<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>

<body>

<input type="checkbox" id="show-signup">

<label for="show-signup" class="signup-btn">Sign Up</label>

<div class="overlay"></div>

<div class="popup-box">
    <label for="show-signup" class="close-btn">×</label>

    <div class="popup-image">
        <img src="https://images.pexels.com/photos/106399/pexels-photo-106399.jpeg" alt="Family House">
    </div>

    <h2>Create Your Account</h2>

    <form>
        <label>Email</label>
        <input type="email" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" placeholder="Re-enter password" required>

        <button type="submit" class="submit-btn">Create Account</button>

        <p class="login-text">Already have an account? <a href="#">Log in</a></p>
    </form>
</div>

</body>
</html>
